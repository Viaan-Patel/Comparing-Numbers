<!DOCTYPE html>
<html>
<head>
<title>Session 17</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>


</head>
<body style="background-image: url(https://media.istockphoto.com/id/157373207/photo/balanced-stones-on-a-pebble-beach-during-sunset.jpg?s=612x612&w=0&k=20&c=V4Lua2fcDJmGiTb_JQu2EP6XmFLuAo7e3eI3cUXPNec=); background-repeat: no-repeat; background-size: cover;">
<div class="container">
<div class="row justify-content-center g-4 my-4">
<div class="col-md-4">
<div class="card p-4 text-center">
<h4 class="mb-3">Enter Number 1</h4>
<label class="form-label">Number 1:</label>
<input class="form-control" type="number" id="num1" placeholder="Enter Number 1">
</div>
</div>

<div class="col-md-4">
<div class="card p-4 text-center">
<h4 class="mb-3">Enter Number 2</h4>
<label class="form-label">Number 2:</label>
<input class="form-control" type="number" id="num2" placeholder="Enter Number 2">
</div>
</div>

</div>
<!-- row 2 starts -->
<div class="row justify-content-center mb-4 g-4">
<div class="col-md-4 text-center">
<button class="btn btn-primary w-100" onclick="compareNumbers()">Compare Numbers</button>
</div>

<div class="col-md-4">
<div class="card p-4 text-center shadow">
<h4>Larger Number</h4>
<p id="result"></p>
</div>
</div>

</div>

</div>

<script>
function compareNumbers(){
    let input1 = document.getElementById("num1").value;
    let input2 = document.getElementById("num2").value;

    if(input1 > input2){
        document.getElementById("result").innerHTML = input1;
        document.getElementById("result").style.color = "green";
    }
    else if(input2 > input1){
        document.getElementById("result").innerHTML = input2;
        document.getElementById("result").style.color = "red";
    }
    else{
        document.getElementById("result").innerHTML = "Both the numbers are equal"
    }
}



</script>
</body>
</html>
